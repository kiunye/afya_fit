stages:
  - test
  - build
  - deploy
  - secret-detection

variables:
  ELIXIR_IMAGE: "hexpm/elixir:1.15-erlang-26.0.1-alpine-3.23.2"
  POSTGRES_DB: afya_fit_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  MIX_ENV: test
  SECRET_DETECTION_ENABLED: "true"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - deps/
    - _build/

.base_test:
  &base_test
  image: ${ELIXIR_IMAGE}
  before_script:
    - apk add --no-cache git build-base
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get --only test

test:compile:
  <<: *base_test
  stage: test
  services: [postgres:15-alpine]
  variables:
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  script: mix compile --warnings-as-errors
  only: &branches [merge_requests, main, develop]

test:format:
  <<: *base_test
  stage: test
  script: mix format --check-formatted
  only: *branches

test:credo:
  <<: *base_test
  stage: test
  script: mix credo --strict
  allow_failure: true
  only: *branches

test:sobelow:
  <<: *base_test
  stage: test
  script: mix sobelow
  allow_failure: true
  only: *branches

test:unit:
  <<: *base_test
  stage: test
  services: [postgres:15-alpine]
  variables:
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  before_script:
    - !reference [.base_test, before_script]
    - mix ecto.create
    - mix ecto.migrate
  script: mix test
  coverage: '/\(\d+\.\d+\)% coverage/'
  artifacts:
    reports:
      junit: test-results.xml
    paths: [coverage/]
    expire_in: 1 week
  only: *branches

build:release:
  image: ${ELIXIR_IMAGE}
  stage: build
  before_script:
    - apk add --no-cache git build-base
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get --only prod
    - mix deps.compile
    - mix assets.deploy
  script: mix release
  artifacts:
    paths: [_build/prod/rel/afya_fit/]
    expire_in: 1 hour
  only: [main, develop, tags]

build:docker:
  stage: build
  image: docker:24-alpine
  services: [docker:24-dind]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG -t $CI_REGISTRY_IMAGE:latest -f Dockerfile .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    - docker push $CI_REGISTRY_IMAGE:latest
  only: [main, develop, tags]

deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $STAGING_SERVER >> ~/.ssh/known_hosts
  script:
    - |
      ssh $STAGING_USER@$STAGING_SERVER << 'EOF'
        cd $STAGING_APP_PATH
        docker-compose -f docker-compose.staging.yml pull
        docker-compose -f docker-compose.staging.yml up -d
        docker-compose -f docker-compose.staging.yml exec -T app mix ecto.migrate
      EOF
  environment:
    name: staging
    url: https://staging.afyafit.com
  when: manual
  only: [develop]

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $PRODUCTION_SERVER >> ~/.ssh/known_hosts
  script:
    - |
      ssh $PRODUCTION_USER@$PRODUCTION_SERVER << 'EOF'
        cd $PRODUCTION_APP_PATH
        docker-compose -f docker-compose.prod.yml pull
        docker-compose -f docker-compose.prod.yml up -d
        docker-compose -f docker-compose.prod.yml exec -T app mix ecto.migrate
      EOF
  environment:
    name: production
    url: https://afyafit.com
  when: manual
  only: [main, tags]

include:
  - template: Security/Secret-Detection.gitlab-ci.yml