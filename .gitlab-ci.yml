stages:
  - test
  - build
  - deploy
  - secret-detection

variables:
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "28.0.2"
  POSTGRES_DB: "afya_fit_test"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  MIX_ENV: "test"
  SECRET_DETECTION_ENABLED: 'true'

# Cache Elixir dependencies
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - deps/
    - _build/

# Test stage
test:compile:
  stage: test
  image: hexpm/elixir:${ELIXIR_VERSION}-erlang-${OTP_VERSION}-ubuntu-jammy-20231004
  services:
    - postgres:15-alpine
  variables:
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  before_script:
    - apt-get update -qq && apt-get install -y -qq git build-essential
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get --only test
  script:
    - mix compile --warnings-as-errors
  only:
    - merge_requests
    - main
    - develop

test:format:
  stage: test
  image: hexpm/elixir:${ELIXIR_VERSION}-erlang-${OTP_VERSION}-ubuntu-jammy-20231004
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get --only test
  script:
    - mix format --check-formatted
  only:
    - merge_requests
    - main
    - develop

test:credo:
  stage: test
  image: hexpm/elixir:${ELIXIR_VERSION}-erlang-${OTP_VERSION}-ubuntu-jammy-20231004
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get --only test
  script:
    - mix credo --strict
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

test:sobelow:
  stage: test
  image: hexpm/elixir:${ELIXIR_VERSION}-erlang-${OTP_VERSION}-ubuntu-jammy-20231004
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get --only test
  script:
    - mix sobelow
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

test:unit:
  stage: test
  image: hexpm/elixir:${ELIXIR_VERSION}-erlang-${OTP_VERSION}-ubuntu-jammy-20231004
  services:
    - postgres:15-alpine
  variables:
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  before_script:
    - apt-get update -qq && apt-get install -y -qq git build-essential
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get --only test
    - mix ecto.create
    - mix ecto.migrate
  script:
    - mix test
  coverage: '/\(\d+\.\d+\)% coverage/'
  artifacts:
    reports:
      junit: test-results.xml
    paths:
      - coverage/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop

# Build stage
build:release:
  stage: build
  image: hexpm/elixir:${ELIXIR_VERSION}-erlang-${OTP_VERSION}-ubuntu-jammy-20231004
  before_script:
    - apt-get update -qq && apt-get install -y -qq git build-essential
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get --only prod
    - mix deps.compile
    - mix assets.deploy
  script:
    - mix release
  artifacts:
    paths:
      - _build/prod/rel/afya_fit/
    expire_in: 1 hour
  only:
    - main
    - develop
    - tags

build:docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG -t $CI_REGISTRY_IMAGE:latest -f Dockerfile .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - develop
    - tags

# Deploy stage (manual deployment to staging/production)
deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $STAGING_SERVER >> ~/.ssh/known_hosts
  script:
    - |
      ssh $STAGING_USER@$STAGING_SERVER << 'EOF'
        cd $STAGING_APP_PATH
        docker-compose -f docker-compose.staging.yml pull
        docker-compose -f docker-compose.staging.yml up -d
        docker-compose -f docker-compose.staging.yml exec -T app mix ecto.migrate
      EOF
  environment:
    name: staging
    url: https://staging.afyafit.com
  when: manual
  only:
    - develop

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $PRODUCTION_SERVER >> ~/.ssh/known_hosts
  script:
    - |
      ssh $PRODUCTION_USER@$PRODUCTION_SERVER << 'EOF'
        cd $PRODUCTION_APP_PATH
        docker-compose -f docker-compose.prod.yml pull
        docker-compose -f docker-compose.prod.yml up -d
        docker-compose -f docker-compose.prod.yml exec -T app mix ecto.migrate
      EOF
  environment:
    name: production
    url: https://afyafit.com
  when: manual
  only:
    - main
    - tags

# Security scanning
include:
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: secret-detection
  only:
    - merge_requests
    - main
    - develop
