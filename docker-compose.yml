services:
  postgres:
    image: postgres:15-alpine
    container_name: afyafit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: afyafit_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: afyafit_dev
    secrets:
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afyafit_dev -d afyafit_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: afyafit_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  db_password:
    file: ./secrets/db_password.txt
  secret_key_base:
    file: ./secrets/secret_key_base.txt
  database_url:
    file: ./secrets/database_url.txt
